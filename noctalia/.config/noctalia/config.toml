[accessibility]
ui_scale = 1.0

[bar.default]
position = "top"
thickness = 36
background_opacity = 1.0
compositor_blur = false
shadow = false
margin_edge = 0
margin_ends = 0
concave_edge_corners = false
radius = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
padding = 12
widget_spacing = 6
hover_highlight = false
scale = 1.0
font_scale = 1.0
start = [ "workspaces", "active_window" ]
center = [ "clock", "notifications" ]
end = [ "media", "group:g1", "tray", "group:status", "control-center" ]

    [[bar.default.capsule_group]]
    border = ""
    fill = "#3a3f44"
    id = "g1"
    members = [ "temp", "sysmon_2", "sysmon_3" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    border = ""
    fill = "#3a3f44"
    id = "status"
    members = [ "network", "bluetooth", "volume", "battery" ]
    opacity = 1.0
    padding = 6.0
    widget_spacing = 8

[shell]
clipboard_image_action_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "community"
community_palette = "Gruvbox Material Hard"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]

[widget.clock]
anchor = true
color = "secondary"
format = "{:%b %d  %H:%M}"
tooltip_format = "{:%A, %d de %B de %Y}"

[widget.launcher]
color = "secondary"
glyph = "grid-dots"

[widget.active_window]
color = "secondary"
display = "icon_and_text"
icon_size = 14
max_length = 220
min_length = 80
title_scroll = "on_hover"

[widget.control-center]
color = "secondary"
glyph = "menu-2"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"
show_label = false
show_vpn_label = false

[widget.notifications]
color = "secondary"

[widget.temp]
show_value = false

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = true
capsule_fill = "#3a3f44"

[widget.volume]
color = "secondary"

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "#3a3f44"
hide_when_empty = true
inactive_pill_size = 1.0
pill_scale = 0.80
show_labels = false
