[shell]
polkit_agent = true
telemetry_enabled = false
offline_mode = true

[weather]
enabled = false

[bar.default]
position = "top"
thickness = 36
background_opacity = 0.85
compositor_blur = true
shadow = false
margin_edge = 0
margin_ends = 0
concave_edge_corners = false
radius = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
padding = 12
widget_spacing = 6
hover_highlight = false
scale = 1.0
font_scale = 1.0
start = [ "cat", "workspaces", "preview", "active_window" ]
center = [ "clock", "notifications" ]
end = [ "media", "group:g1", "mini-docker", "group:netp", "tray", "group:status", "control-center" ]

    [[bar.default.capsule_group]]
    border = ""
    fill = "#3a3f44"
    id = "g1"
    members = [ "temp", "sysmon_2", "sysmon_3" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    border = ""
    fill = "#3a3f44"
    id = "net"
    members = [ "net_down", "net_up" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    border = ""
    fill = "#3a3f44"
    id = "status"
    members = [ "network", "bluetooth", "volume", "battery" ]
    opacity = 1.0
    padding = 6.0
    widget_spacing = 8

    [[bar.default.capsule_group]]
    border = ""
    fill = "#3a3f44"
    id = "netp"
    members = [ "dns-switcher", "tailscale", "syncthing" ]
    opacity = 1.0
    padding = 6.0

[widget.clock]
anchor = true
color = "secondary"
format = "{:%b %d  %H:%M}"
tooltip_format = "{:%A, %d de %B de %Y}"

[widget.active_window]
color = "secondary"
display = "icon_and_text"
icon_size = 14
max_length = 220
min_length = 80
title_scroll = "on_hover"

[widget.control-center]
color = "secondary"
glyph = "menu-2"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"
art_size = 14
min_length = 60
max_length = 140

[widget.cat]
type = "noctalia/bongocat:cat"
audio_spectrum = false
tappy_mode = false
rave_mode = false
use_mpris_filter = false
input_devices = [ "/dev/input/event18", "/dev/input/by-path/platform-i8042-serio-0-event-kbd" ]

[widget.net_down]
type = "sysmon"
stat = "net_rx"
glyph = "arrow-down"
show_value = true

[widget.net_up]
type = "sysmon"
stat = "net_tx"
glyph = "arrow-up"
show_value = true

[widget.network]
color = "secondary"
show_label = false
show_vpn_label = false

[widget.notifications]
color = "secondary"

[widget.temp]
show_value = false

[widget.sysmon_2]
glyph = "temperature"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
show_value = true
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = true
capsule_fill = "#3a3f44"

[widget.volume]
color = "secondary"

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "#3a3f44"
hide_when_empty = false
inactive_pill_size = 1.0
pill_scale = 0.80
show_labels = false


[widget.preview]
type = "teagar/niri-workspace-preview:preview"
output_scope = "current"
size_mode = "auto"
preview_size = 24
show_icons = true

[widget.dns-switcher]
type = "nightwatch75/dns-switcher:dns-switcher"
show_label = false
poll_seconds = 30


[widget.tailscale]
type = "davemhammer/tailscale:status"
show_counts = true
hide_when_healthy = false
refresh_interval = 30
show_label = false

[widget.mini-docker]
type = "8bury/mini-docker:mini-docker"
show_count = true
respect_socket_activation = true
refresh_interval = 10


[widget.syncthing]
type = "rylos/syncthing:bar"
poll_interval = 30


[wallpaper]
enabled = true
directory = "~/Pictures/Wallpapers"
fill_mode = "crop"

[wallpaper.automation]
enabled = true
interval_seconds = 1800
order = "random"
recursive = false
pause_on_fullscreen = true

[plugins]
enabled = [ "teagar/niri-workspace-preview", "emrtnn/pass", "nightwatch75/dns-switcher", "davemhammer/tailscale", "8bury/mini-docker", "rylos/syncthing", "congluantran/calibre", "radimous/prismlauncher-instances", "noctalia/bongocat" ]
auto_update = "none"

[shell.launcher]
layout = "simple"
width = 560
search_position = "top"
default_view = "recent"
categories = false
show_icons = true
compact = true
app_grid = false
