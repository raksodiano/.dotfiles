# mpv configuration: quality playback with Vim-style keys (see input.conf).
# Cache and watch history stay under XDG directories, out of the repo.

# High-quality video output with hardware decoding when available.
profile=gpu-hq
hwdec=auto-safe

# On-screen controller in Gruvbox tones is handled by the theme script;
# keep the native OSC small and autohiding.
osc=yes
osd-bar=yes
osd-font-size=22

# Remember where every file stopped; resume with Shift+q binding in mpv.
save-position-on-quit=yes
watch-later-directory=~/.local/share/mpv/watch-later

# Screenshots next to the Pictures folder with timestamps.
screenshot-template=~/Pictures/mpv-%F-%P
screenshot-format=png

# Subtitles: load external files automatically, prefer English/Spanish.
sub-auto=fuzzy
slang=en,es
alang=en,es

# Cap streaming quality at 1080p through your managed yt-dlp.
ytdl-format=bv*[height<=1080]+ba/b

# Slightly louder ceiling for quiet videos.
volume-max=150
