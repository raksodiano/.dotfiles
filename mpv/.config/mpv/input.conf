# Vim-style extras on top of mpv defaults (which already use hjkl/arrows).

# Small and large seeks.
l seek 5
h seek -5
L seek 60
H seek -60

# Playback speed without opening the menu.
[ add speed -0.1
] add speed 0.1
BS set speed 1.0

# Chapter jumps.
{ add chapter -1
} add chapter 1

# Playlist navigation.
n playlist-next
p playlist-prev
