# Forzar ruta de instalación de plugins
set -g @tpm_plugins_path "$HOME/.tmux/plugins"

# Configurar variable de entorno para TPM
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"

# set -g prefix C-b
unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix

# Reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# At top
set-option -g status-position top

# Theme hygiene: keep a clean fallback without pane_title (user@host).
set -g status-right "%H:%M  %d-%b-%y"
# Movement
bind-key -n C-Left select-pane -L
bind-key -n C-Down select-pane -D
bind-key -n C-Right select-pane -R
bind-key -n C-Up select-pane -U

# Move between panes with vim keys (Alt+hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Move between windows with vim keys (prefix+H/L)
bind -r H select-window -t -1
bind -r L select-window -t +1

# move with vim keys in pane selection
set-window-option -g mode-keys vi   # vi style key bindings
bind-key v copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Fine adjustment (1 or 2 cursor cells per bump)
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down resize-pane -D 1
bind -n S-Up resize-pane -U 1

# Splitting windows
bind-key - split-window -v -c '#{pane_current_path}'
bind-key \\ split-window -h -c '#{pane_current_path}'

# New window
bind c new-window -c "#{pane_current_path}"

# Break window
bind-key b break-pane -d

# bind-key d split-window -h 'gotop'
bind-key t split-window -h -c 'nvim ~/Vaults/inbox.md'

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# THEME
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

#List of plugins------------------------#
set -g @plugin 'tmux-plugins/tpm#e261deb1b47614eed3400089ce7197dc68acc4eb'
set -g @plugin 'tmux-plugins/tmux-sensible#25cb91f42d020f675bb0a2ce3fbd3a5d96119efa'
set -g @plugin 'tmux-plugins/tmux-resurrect#cff343cf9e81983d3da0c8562b01616f12e8d548'
set -g @plugin 'tmux-plugins/tmux-continuum#0698e8f4b17d6454c71bf5212895ec055c578da0'
set -g @continuum-restore 'on'
set -g @plugin 'omerxx/tmux-sessionx#8df6df56639acedb5343a6db02cf58120ff09ef7'
set -g @plugin 'jimeh/tmuxifier#9b539b7248f14243a5c6c415a9ead16489bb8625'
set -g @plugin 'z3z1ma/tmux-gruvbox#8f71abd479e60f9a663abdc42e06491b7e8e6a25'
# Usar la paleta Material Hard para encajar con el resto del sistema
set -g @gruvbox_flavour 'material'
# Modulos de la barra derecha (sin user/host para no mostrar usuario/equipo)
set -g @gruvbox_status_modules_right "application session date_time"
set -g @gruvbox_status_modules_left ""

# Scrolling
set -g @plugin 'noscript/tmux-mighty-scroll#fa5db0718e9e9f7278520ecf63b96b84b0cc57d6'
set -g mouse on
set -g @mighty-scroll-interval 3
set -g @mighty-scroll-by-line 'man fzf'
set -g @mighty-scroll-select-pane off

# Tmux Yank
set -g @plugin 'tmux-plugins/tmux-yank#acfd36e4fcba99f8310a7dfb432111c242fe7392'

run '~/.tmux/plugins/tpm/tpm'