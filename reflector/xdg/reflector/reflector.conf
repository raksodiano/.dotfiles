# Reflector configuration file for the systemd service.
#
# Empty lines and lines beginning with "#" are ignored. All other lines should
# contain valid reflector command-line arguments (parsed with shlex).
# See "reflector --help" for details.

# Save the generated mirrorlist here.
--save /etc/pacman.d/mirrorlist

# Use only HTTPS mirrors.
--protocol https

# Use only the most recently synchronized mirrors.
--latest 20

# Sort mirrors by download speed (helps avoid "Operation too slow" errors).
--sort rate
