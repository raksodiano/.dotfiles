# MPD configuration (restored from 8ece01d, modernized for PipeWire + XDG).
# Runtime files stay out of the repository: state under
# ~/.local/share/mpd, cache and logs under ~/.cache/mpd.

bind_to_address "127.0.0.1"
port "6600"

music_directory "/home/raksodiano/Music"
playlist_directory "/home/raksodiano/.local/share/mpd/playlists"
db_file "/home/raksodiano/.local/share/mpd/database"
state_file "/home/raksodiano/.local/share/mpd/state"
log_file "/home/raksodiano/.cache/mpd/log"
pid_file "/home/raksodiano/.cache/mpd/pid"

log_level "notice"
auto_update "yes"
auto_update_depth "5"
follow_outside_symlinks "yes"
follow_inside_symlinks "yes"

audio_output {
  type "pulse"
  name "PipeWire"
}
