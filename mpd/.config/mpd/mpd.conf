# MPD configuration (modernized for PipeWire + XDG).
# Runtime files stay out of the repository: state under
# ~/.local/share/mpd, cache and logs under ~/.cache/mpd.

bind_to_address "$XDG_RUNTIME_DIR/mpd.sock"

music_directory "~/Music"
playlist_directory "~/.local/share/mpd/playlists"
db_file "~/.local/share/mpd/database"
state_file "~/.local/share/mpd/state"
log_file "~/.cache/mpd/log"
pid_file "~/.cache/mpd/pid"

log_level "notice"
auto_update "yes"
auto_update_depth "5"
follow_outside_symlinks "no"
follow_inside_symlinks "no"

audio_output {
  type "pulse"
  name "PipeWire"
}
