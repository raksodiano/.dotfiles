# Gruvbox dark theme for Yazi, built on the upstream flavor template
# (yazi-rs/flavors scripts/template.toml) with literal Gruvbox colors.
# Palette: bg #282828, bg1 #3c3836, fg #ebdbb2, gray #928374,
# yellow #fabd2f, orange #fe8019, blue #83a598, purple #d3869b.

[mgr]
cwd = { fg = "#fabd2f" }

# Find
find_keyword  = { fg = "#fabd2f", bold = true, italic = true, underline = true }
find_position = { fg = "#d3869b", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#b8bb26", bg = "#b8bb26" }
marker_cut      = { fg = "#fb4934", bg = "#fb4934" }
marker_marked   = { fg = "#83a598", bg = "#83a598" }
marker_selected = { fg = "#fabd2f", bg = "#fabd2f" }

# Count
count_copied   = { fg = "#282828", bg = "#b8bb26" }
count_cut      = { fg = "#282828", bg = "#fb4934" }
count_selected = { fg = "#282828", bg = "#fabd2f" }

# Border
border_symbol = "│"
border_style  = { fg = "#928374" }

[tabs]
active   = { fg = "#282828", bg = "#fabd2f", bold = true }
inactive = { fg = "#fabd2f", bg = "#3c3836" }

[mode]
normal_main = { fg = "#282828", bg = "#fabd2f", bold = true }
normal_alt  = { fg = "#fabd2f", bg = "#3c3836" }

# Select mode
select_main = { fg = "#282828", bg = "#83a598", bold = true }
select_alt  = { fg = "#83a598", bg = "#3c3836" }

# Unset mode
unset_main = { fg = "#282828", bg = "#fe8019", bold = true }
unset_alt  = { fg = "#fe8019", bg = "#3c3836" }

[status]
# Permissions
perm_sep   = { fg = "#928374" }
perm_type  = { fg = "#83a598" }
perm_read  = { fg = "#fabd2f" }
perm_write = { fg = "#fb4934" }
perm_exec  = { fg = "#b8bb26" }

# Progress
progress_label  = { fg = "#ebdbb2", bold = true }
progress_normal = { fg = "#b8bb26", bg = "#3c3836" }
progress_error  = { fg = "#fabd2f", bg = "#fb4934" }

[pick]
border   = { fg = "#fabd2f" }
active   = { fg = "#d3869b", bold = true }
inactive = {}

[input]
border   = { fg = "#fabd2f" }
title    = {}
value    = {}
selected = { reversed = true }

[cmp]
border = { fg = "#fabd2f" }

[tasks]
border  = { fg = "#fabd2f" }
title   = {}
hovered = { fg = "#d3869b", bold = true }

[which]
border          = { fg = "#fabd2f" }
cand            = { fg = "#83a598" }
rest            = { fg = "#a89984" }
desc            = { fg = "#d3869b" }
separator       = "  "
separator_style = { fg = "#504945" }

[help]
on      = { fg = "#83a598" }
run     = { fg = "#d3869b" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#3c3836", bg = "#ebdbb2" }

[spot]
border   = { fg = "#fabd2f" }
title    = { fg = "#fabd2f" }
tbl_col  = { fg = "#83a598" }
tbl_cell = { fg = "#d3869b", bg = "#3c3836" }

[notify]
title_info  = { fg = "#b8bb26" }
title_warn  = { fg = "#fabd2f" }
title_error = { fg = "#fb4934" }

[filetype]
rules = [
	# Image
	{ mime = "**/image/*", fg = "#83a598" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "#fabd2f" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d3869b" },
	# Document
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#b8bb26" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#a89984" },
	# Fallback
	{ url = "*", fg = "#ebdbb2" },
	{ url = "*/", fg = "#fabd2f" },
]

[icon]
dirs = [
	{ name = ".config", text = "", fg = "#d3869b" },
	{ name = ".git", text = "", fg = "#83a598" },
	{ name = ".github", text = "", fg = "#fabd2f" },
	{ name = ".npm", text = "", fg = "#fabd2f" },
	{ name = "Desktop", text = "", fg = "#83a598" },
	{ name = "Development", text = "", fg = "#83a598" },
	{ name = "Documents", text = "", fg = "#83a598" },
	{ name = "Downloads", text = "", fg = "#83a598" },
	{ name = "Library", text = "", fg = "#83a598" },
	{ name = "Movies", text = "", fg = "#83a598" },
	{ name = "Music", text = "", fg = "#83a598" },
	{ name = "Pictures", text = "", fg = "#83a598" },
	{ name = "Public", text = "", fg = "#83a598" },
	{ name = "Videos", text = "", fg = "#83a598" },
]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#ebdbb2" },
	{ if = "link", text = "", fg = "#928374" },
	{ if = "block", text = "", fg = "#fe8019" },
	{ if = "char", text = "", fg = "#fe8019" },
	{ if = "fifo", text = "", fg = "#fe8019" },
	{ if = "sock", text = "", fg = "#fe8019" },
	{ if = "sticky", text = "", fg = "#fe8019" },
	{ if = "dummy", text = "", fg = "#fb4934" },

	# Fallback
	{ if = "dir & hovered", text = "", fg = "#83a598" },
	{ if = "dir", text = "", fg = "#83a598" },
	{ if = "exec", text = "", fg = "#b8bb26" },
	{ if = "!dir", text = "", fg = "#ebdbb2" },
]
